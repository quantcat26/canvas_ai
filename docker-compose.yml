version: "3.9"

services:
  canvas-ai:
    build: .
    container_name: canvas-ai
    ports:
      - "5176:5176"
    volumes:
      # Persist SQLite database outside the container
      - canvas_ai_data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=5176
      # Required: AI_CONFIG_SECRET is used to encrypt/decrypt API keys in the database.
      # Generate one with: openssl rand -hex 32
      - AI_CONFIG_SECRET=${AI_CONFIG_SECRET}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5176/api"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  canvas_ai_data:
